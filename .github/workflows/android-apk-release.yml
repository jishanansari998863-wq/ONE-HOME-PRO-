name: Android Build, Test & APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish Debug APK to GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  android-build-and-test:
    name: Test & Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Command-line Tools & pre-accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_ROOT" ]; then
            if [ ! -w "$SDK_ROOT" ]; then
              sudo chown -R "$USER:$USER" "$SDK_ROOT"
            fi
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          mkdir -p "$SDK_ROOT/licenses"

          find_sdkmanager() {
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif command -v sdkmanager >/dev/null 2>&1; then
              command -v sdkmanager
            elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
              find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sed -n '1p' || true
            fi
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12700392_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extracted"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$TMP_DIR/extracted/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          # Accept all currently known SDK licenses non-interactively (ignore SIGPIPE 141 from yes)
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
            rc=$?
            [ "$rc" -eq 141 ] || exit "$rc"
          }
          set -o pipefail

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages & verify licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          install_pkg() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$1" || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          accept_licenses
          install_pkg "cmdline-tools;latest"
          install_pkg "platform-tools"
          install_pkg "build-tools;36.0.0"
          install_pkg "platforms;android-36"

          SDK_LIST="$("$SDKMANAGER" --sdk_root="$SDK_ROOT" --list)"
          if echo "$SDK_LIST" | grep -E '^[[:space:]]*platforms;android-36\.1([[:space:]]|\|)' >/dev/null; then
            install_pkg "platforms;android-36.1"
          fi

          accept_licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

      - name: Ensure debug keystore exists
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Set up Node.js for Firebase Emulator & Rules Tests
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v15

      - name: Install Firebase CLI & Rules Unit Testing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools @firebase/rules-unit-testing
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Configure optional google-services.json from GitHub Secrets
        if: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GOOGLE_SERVICES_JSON" == \{* ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
          test -s app/google-services.json

      - name: Verify google-services.json is present
        shell: bash
        run: |
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Commit app/google-services.json or set the GOOGLE_SERVICES_JSON GitHub Actions secret."
            exit 1
          fi

      - name: Run Firestore Rules Tests Independently
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="${NODE_PATH:-$(npm root -g)}"
          firebase emulators:exec --only auth,firestore --project demo-no-project '
            NODE_PATH="'"$NODE_PATH"'" node --test firestore.test.js
          '

      - name: Run Android Unit, Robolectric & Emulator Security Tests
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --only auth,firestore --project demo-no-project '
            gradle :app:testDebugUnitTest --no-daemon --max-workers=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" --stacktrace --console=plain
          '

      - name: Build Android Debug APK
        run: >
          gradle :app:assembleDebug
          --no-daemon
          --max-workers=2
          -Dkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8"
          --stacktrace
          --console=plain

      - name: Verify Debug APK & bundled Firebase resources exist
        id: apk_meta
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ONE_HOME_PRO_FINAL.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk ONE_HOME_PRO_FINAL.apk
          AAPT2="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0/aapt2"
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -q "string/google_app_id"
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -q "string/google_api_key"
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -q "string/default_web_client_id"
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -q "string/firestore_database_id"
          "$AAPT2" dump resources app/build/outputs/apk/debug/app-debug.apk | grep -q "string/project_id"
          VERSION_NAME="$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)"
          VERSION_CODE="$(grep -E 'versionCode\s*=' app/build.gradle.kts | sed -E 's/[^0-9]//g' | head -n 1)"
          echo "version_name=${VERSION_NAME:-1.0.2}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-2}" >> "$GITHUB_OUTPUT"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/

      - name: Upload Android Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: one-home-pro-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ONE_HOME_PRO_FINAL.apk
          if-no-files-found: error

      - name: Build Signed Release APK & Play Store AAB (when upload keystore secrets configured)
        if: >-
          success() &&
          secrets.RELEASE_KEYSTORE_BASE64 != '' &&
          secrets.STORE_PASSWORD != '' &&
          secrets.KEY_PASSWORD != ''
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          trap 'rm -f my-upload-key.jks' EXIT
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle :app:bundleRelease :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx2560m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8" \
            --stacktrace \
            --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release Artifacts (when built)
        if: >-
          success() &&
          secrets.RELEASE_KEYSTORE_BASE64 != '' &&
          secrets.STORE_PASSWORD != '' &&
          secrets.KEY_PASSWORD != ''
        uses: actions/upload-artifact@v6
        with:
          name: one-home-pro-signed-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Release
        if: >-
          success() && (
            startsWith(github.ref, 'refs/tags/v') ||
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
          )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build-{1}-ci-{2}', steps.apk_meta.outputs.version_name, steps.apk_meta.outputs.version_code, github.run_number) }}
          name: ONE HOME PRO v${{ steps.apk_meta.outputs.version_name }} (Build ${{ steps.apk_meta.outputs.version_code }} / CI #${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ONE_HOME_PRO_FINAL.apk
            app/build/outputs/apk/debug/app-debug.apk
