name: Android Build, Test & APK Release

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish Debug APK to GitHub Release'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  firestore-rules-tests:
    name: 1. Firestore Security Rules Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21 for Firebase Emulator
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v15

      - name: Install Firebase CLI & Rules Unit Testing
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools @firebase/rules-unit-testing
          echo "NODE_PATH=$(npm root -g)" >> "$GITHUB_ENV"

      - name: Run Firestore Rules Tests
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="${NODE_PATH:-$(npm root -g)}"
          firebase emulators:exec --only auth,firestore --project demo-no-project '
            NODE_PATH="'"$NODE_PATH"'" node --test firestore.test.js
          '

  android-tests-and-lint:
    name: 2. Android Unit, Robolectric, UI & Emulator Tests + Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configure Android SDK Command-line Tools & pre-accept licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ -d "$SDK_ROOT" ]; then
            if [ ! -w "$SDK_ROOT" ]; then
              sudo chown -R "$USER:$USER" "$SDK_ROOT"
            fi
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          mkdir -p "$SDK_ROOT/licenses"

          find_sdkmanager() {
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif command -v sdkmanager >/dev/null 2>&1; then
              command -v sdkmanager
            elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
              find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sed -n '1p' || true
            fi
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12700392_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extracted"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$TMP_DIR/extracted/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
            rc=$?
            [ "$rc" -eq 141 ] || exit "$rc"
          }
          set -o pipefail

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages & verify licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          install_pkg() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$1" || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          accept_licenses
          install_pkg "cmdline-tools;latest"
          install_pkg "platform-tools"
          install_pkg "build-tools;36.0.0"
          install_pkg "platforms;android-36"

          SDK_LIST="$("$SDKMANAGER" --sdk_root="$SDK_ROOT" --list)"
          if echo "$SDK_LIST" | grep -E '^[[:space:]]*platforms;android-36\.1([[:space:]]|\|)' >/dev/null; then
            install_pkg "platforms;android-36.1"
          fi

          accept_licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

      - name: Ensure debug keystore exists
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ]; then
            if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
              python3 - <<'PY'
          import base64
          import os
          import sys

          raw_env = os.environ["DEBUG_KEYSTORE_BASE64"].lstrip("\ufeff").strip()
          if (raw_env.startswith('"') and raw_env.endswith('"')) or (raw_env.startswith("'") and raw_env.endswith("'")):
              raw_env = raw_env[1:-1]
          compact = "".join(raw_env.split())
          compact += "=" * ((-len(compact)) % 4)
          data = None
          for decoder in (base64.b64decode, base64.urlsafe_b64decode):
              try:
                  candidate = decoder(compact)
                  if len(candidate) > 100:
                      data = candidate
                      break
              except Exception:
                  pass
          if data is None:
              print("::error::DEBUG_KEYSTORE_BASE64 secret is not valid Base64.")
              sys.exit(1)
          with open("debug.keystore", "wb") as f:
              f.write(data)
          print("Restored debug.keystore from DEBUG_KEYSTORE_BASE64.")
          PY
            elif [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
              echo "Restored debug.keystore from debug.keystore.base64."
            else
              echo "::warning::DEBUG_KEYSTORE_BASE64 secret not set; generating ephemeral debug keystore for unit/lint tests only."
              keytool -genkeypair -noprompt \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi
          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android >/dev/null

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache Firebase Emulators
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v15

      - name: Install Firebase CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install -g firebase-tools

      - name: Configure optional google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "")
          if not raw or not raw.strip():
              print("GOOGLE_SERVICES_JSON secret not configured; checking repository app/google-services.json.")
              sys.exit(0)

          cleaned = raw.lstrip("\ufeff").strip()
          decoded_text = None

          if cleaned.startswith("{"):
              try:
                  json.loads(cleaned)
                  decoded_text = cleaned + "\n"
              except Exception as exc:
                  print(f"::error::GOOGLE_SERVICES_JSON looks like raw JSON but failed to parse: {exc}")
                  sys.exit(1)
          elif cleaned.startswith('"'):
              try:
                  unquoted = json.loads(cleaned)
                  if isinstance(unquoted, str) and unquoted.lstrip("\ufeff").strip().startswith("{"):
                      json.loads(unquoted)
                      decoded_text = unquoted.lstrip("\ufeff").strip() + "\n"
              except Exception:
                  pass

          if decoded_text is None and not cleaned.startswith("{"):
              b64_compact = "".join(cleaned.split())
              pad_len = (-len(b64_compact)) % 4
              b64_padded = b64_compact + ("=" * pad_len)
              for decoder in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      candidate = decoder(b64_padded)
                      text = candidate.decode("utf-8").lstrip("\ufeff").strip()
                      if text.startswith("{"):
                          json.loads(text)
                          decoded_text = text + "\n"
                          break
                  except Exception:
                      pass

          if decoded_text is None:
              print("::error::GOOGLE_SERVICES_JSON secret is neither valid JSON nor valid Base64-encoded JSON.")
              sys.exit(1)

          os.makedirs("app", exist_ok=True)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              f.write(decoded_text)
          if os.path.getsize("app/google-services.json") <= 0:
              print("::error::Written app/google-services.json is empty.")
              sys.exit(1)
          print("Successfully wrote app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Verify google-services.json is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Commit app/google-services.json or set the GOOGLE_SERVICES_JSON GitHub Actions secret."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import re
          import sys

          with open("app/google-services.json", "r", encoding="utf-8-sig") as f:
              data = json.load(f)

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()

          m = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle_text)
          if not m:
              print("::error::Could not determine applicationId from app/build.gradle.kts.")
              sys.exit(1)
          app_id = m.group(1)

          project_id = (data.get("project_info") or {}).get("project_id", "")
          clients = data.get("client") or []
          pkg_names = [
              ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name", "")
              for c in clients
          ]
          has_api_key = any(
              bool((c.get("api_key") or [{}])[0].get("current_key"))
              for c in clients
              if c.get("api_key")
          )

          if not project_id or not has_api_key:
              print("::error::app/google-services.json is incomplete (missing project_id or api_key).")
              sys.exit(1)
          if app_id not in pkg_names:
              print(f"::error::Firebase package_name mismatch. Expected '{app_id}', found {pkg_names}.")
              sys.exit(1)

          print(f"Verified app/google-services.json: project_id={project_id}, package_name={app_id}")
          PY

      - name: Run Android Unit, Robolectric & Emulator Security Tests
        shell: bash
        run: |
          set -euo pipefail
          firebase emulators:exec --only auth,firestore --project demo-no-project '
            gradle :app:testDebugUnitTest --no-daemon --max-workers=2 -Dkotlin.compiler.execution.strategy=in-process -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" --stacktrace --console=plain
          '

      - name: Run Android Lint (Debug)
        run: >
          gradle :app:lintDebug
          --no-daemon
          --max-workers=2
          -Dkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
          --console=plain

      - name: Upload Test & Lint Reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-and-lint-reports
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
            app/build/reports/lint-results-debug.txt

  build-and-publish-apk:
    name: 3. Build, Verify & Publish APK Release
    needs: [ firestore-rules-tests, android-tests-and-lint ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
