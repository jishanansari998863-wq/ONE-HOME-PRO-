              sudo chown -R "$USER:$USER" "$SDK_ROOT"
            fi
          else
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          mkdir -p "$SDK_ROOT/licenses"

          find_sdkmanager() {
            if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
            elif command -v sdkmanager >/dev/null 2>&1; then
              command -v sdkmanager
            elif [ -d "$SDK_ROOT/cmdline-tools" ]; then
              find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sed -n '1p' || true
            fi
          }

          SDKMANAGER="$(find_sdkmanager)"
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            TMP_DIR="$(mktemp -d)"
            curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-12700392_latest.zip" -o "$TMP_DIR/cmdline-tools.zip"
            unzip -q "$TMP_DIR/cmdline-tools.zip" -d "$TMP_DIR/extracted"
            mkdir -p "$SDK_ROOT/cmdline-tools"
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv "$TMP_DIR/extracted/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
            rm -rf "$TMP_DIR"
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
            rc=$?
            [ "$rc" -eq 141 ] || exit "$rc"
          }
          set -o pipefail

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true

      - name: Install Android SDK packages & verify licenses
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager)"
          fi

          accept_licenses() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          install_pkg() {
            set +o pipefail
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "$1" || {
              rc=$?
              [ "$rc" -eq 141 ] || exit "$rc"
            }
            set -o pipefail
          }

          accept_licenses
          install_pkg "cmdline-tools;latest"
          install_pkg "platform-tools"
          install_pkg "build-tools;36.0.0"
          install_pkg "platforms;android-36"

          SDK_LIST="$("$SDKMANAGER" --sdk_root="$SDK_ROOT" --list)"
          if echo "$SDK_LIST" | grep -E '^[[:space:]]*platforms;android-36\.1([[:space:]]|\|)' >/dev/null; then
            install_pkg "platforms;android-36.1"
          fi

          accept_licenses
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --version

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.3.1'

      - name: Configure optional google-services.json from GitHub Secrets
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON || vars.GOOGLE_SERVICES_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import sys

          raw = os.environ.get("GOOGLE_SERVICES_JSON", "")
          if not raw or not raw.strip():
              print("GOOGLE_SERVICES_JSON secret not configured; checking repository app/google-services.json.")
              sys.exit(0)

          cleaned = raw.lstrip("\ufeff").strip()
          decoded_text = None

          if cleaned.startswith("{"):
              try:
                  json.loads(cleaned)
                  decoded_text = cleaned + "\n"
              except Exception as exc:
                  print(f"::error::GOOGLE_SERVICES_JSON looks like raw JSON but failed to parse: {exc}")
                  sys.exit(1)
          elif cleaned.startswith('"'):
              try:
                  unquoted = json.loads(cleaned)
                  if isinstance(unquoted, str) and unquoted.lstrip("\ufeff").strip().startswith("{"):
                      json.loads(unquoted)
                      decoded_text = unquoted.lstrip("\ufeff").strip() + "\n"
              except Exception:
                  pass

          if decoded_text is None and not cleaned.startswith("{"):
              b64_compact = "".join(cleaned.split())
              pad_len = (-len(b64_compact)) % 4
              b64_padded = b64_compact + ("=" * pad_len)
              for decoder in (base64.b64decode, base64.urlsafe_b64decode):
                  try:
                      candidate = decoder(b64_padded)
                      text = candidate.decode("utf-8").lstrip("\ufeff").strip()
                      if text.startswith("{"):
                          json.loads(text)
                          decoded_text = text + "\n"
                          break
                  except Exception:
                      pass

          if decoded_text is None:
              print("::error::GOOGLE_SERVICES_JSON secret is neither valid JSON nor valid Base64-encoded JSON.")
              sys.exit(1)

          os.makedirs("app", exist_ok=True)
          with open("app/google-services.json", "w", encoding="utf-8") as f:
              f.write(decoded_text)
          if os.path.getsize("app/google-services.json") <= 0:
              print("::error::Written app/google-services.json is empty.")
              sys.exit(1)
          print("Successfully wrote app/google-services.json from GOOGLE_SERVICES_JSON secret.")
          PY

      - name: Verify google-services.json is present
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s app/google-services.json ]; then
            echo "::error::app/google-services.json is missing. Commit app/google-services.json or set the GOOGLE_SERVICES_JSON GitHub Actions secret."
            exit 1
          fi
          python3 - <<'PY'
          import json
          import re
          import sys

          with open("app/google-services.json", "r", encoding="utf-8-sig") as f:
              data = json.load(f)

          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()

          m = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle_text)
          if not m:
              print("::error::Could not determine applicationId from app/build.gradle.kts.")
              sys.exit(1)
          app_id = m.group(1)

          project_id = (data.get("project_info") or {}).get("project_id", "")
          clients = data.get("client") or []
          pkg_names = [
              ((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name", "")
              for c in clients
          ]
          has_api_key = any(
              bool((c.get("api_key") or [{}])[0].get("current_key"))
              for c in clients
              if c.get("api_key")
          )

          if not project_id or not has_api_key:
              print("::error::app/google-services.json is incomplete (missing project_id or api_key).")
              sys.exit(1)
          if app_id not in pkg_names:
              print(f"::error::Firebase package_name mismatch. Expected '{app_id}', found {pkg_names}.")
              sys.exit(1)

          print(f"Verified app/google-services.json: project_id={project_id}, package_name={app_id}")
          PY

      - name: Restore & verify debug.keystore SHA-1 against Firebase before build
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 || vars.DEBUG_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${DEBUG_KEYSTORE_BASE64:-}" ]; then
            python3 - <<'PY'
          import base64
          import os
          import sys

          raw_env = os.environ["DEBUG_KEYSTORE_BASE64"].lstrip("\ufeff").strip()
          if (raw_env.startswith('"') and raw_env.endswith('"')) or (raw_env.startswith("'") and raw_env.endswith("'")):
              raw_env = raw_env[1:-1]
          compact = "".join(raw_env.split())
          compact += "=" * ((-len(compact)) % 4)
          data = None
          for decoder in (base64.b64decode, base64.urlsafe_b64decode):
              try:
                  candidate = decoder(compact)
                  if len(candidate) > 100:
                      data = candidate
                      break
              except Exception:
                  pass
          if data is None:
              print("::error::DEBUG_KEYSTORE_BASE64 secret is invalid Base64. Copy the exact single-line text from debug.keystore.base64 into GitHub Repository Secret DEBUG_KEYSTORE_BASE64.")
              sys.exit(1)
          with open("debug.keystore", "wb") as f:
              f.write(data)
          print("Restored debug.keystore from DEBUG_KEYSTORE_BASE64 secret.")
          PY
          elif [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore from debug.keystore.base64."
          elif [ ! -f debug.keystore ]; then
            echo "::error::DEBUG_KEYSTORE_BASE64 GitHub Actions Repository Secret is missing or empty! Add Repository Secret DEBUG_KEYSTORE_BASE64 (from workspace debug.keystore.base64) in Settings > Secrets and variables > Actions so the built APK matches Firebase SHA-1."
            exit 1
          fi

          test -s debug.keystore
          KEYTOOL_OUT="$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey)"
          echo "$KEYTOOL_OUT" | grep -E "Alias name:|SHA1:|SHA256:"
          KEYSTORE_SHA1="$(printf '%s\n' "$KEYTOOL_OUT" | sed -nE 's/^[[:space:]]*SHA1:[[:space:]]*([0-9a-fA-F:]+).*/\1/p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"

          python3 - "$KEYSTORE_SHA1" <<'PY'
          import json
          import re
          import sys

          ks_sha1 = (sys.argv[1] if len(sys.argv) > 1 else "").strip().lower()
          if not ks_sha1:
              print("::error::Could not read SHA1 from debug.keystore (alias androiddebugkey).")
              sys.exit(1)

          with open("app/google-services.json", "r", encoding="utf-8-sig") as f:
              gs = json.load(f)
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()
          m = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle_text)
          app_id = m.group(1) if m else ""

          expected_hashes = []
          for client in gs.get("client") or []:
              for oauth in client.get("oauth_client") or []:
                  android_info = oauth.get("android_info") or {}
                  if android_info.get("package_name") == app_id and android_info.get("certificate_hash"):
                      expected_hashes.append(android_info["certificate_hash"].replace(":", "").strip().lower())

          print(f"Pre-build keystore SHA-1: {ks_sha1}")
          print(f"Expected Firebase SHA-1 for {app_id}: {expected_hashes}")
          if expected_hashes and ks_sha1 not in expected_hashes:
              print(f"::error::Pre-build debug.keystore SHA-1 mismatch! Secret DEBUG_KEYSTORE_BASE64 produced SHA-1 {ks_sha1}, but Firebase expects {expected_hashes}. Update DEBUG_KEYSTORE_BASE64 from debug.keystore.base64.")
              sys.exit(1)
          print("Pre-build check PASSED: debug.keystore SHA-1 matches Firebase certificate_hash.")
          PY

      - name: Build Android Debug APK
        run: >
          gradle :app:assembleDebug
          --no-daemon
          --max-workers=2
          -Dkotlin.compiler.execution.strategy=in-process
          -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8"
          --stacktrace
          --console=plain

      - name: Verify Debug APK, Firebase Resources & APK Signature
        id: apk_meta
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ONE_HOME_PRO_FINAL.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk ONE_HOME_PRO_FINAL.apk
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          AAPT2="$SDK_ROOT/build-tools/36.0.0/aapt2"
          [ -x "$AAPT2" ] || AAPT2="$(find "$SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"
          APKSIGNER="$SDK_ROOT/build-tools/36.0.0/apksigner"
          [ -x "$APKSIGNER" ] || APKSIGNER="$(find "$SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          RES_DUMP="$(mktemp)"
          trap 'rm -f "$RES_DUMP"' EXIT
          "$AAPT2" dump resources ONE_HOME_PRO_FINAL.apk > "$RES_DUMP"
          grep -q "string/google_app_id" "$RES_DUMP"
          grep -q "string/google_api_key" "$RES_DUMP"
          grep -q "string/default_web_client_id" "$RES_DUMP"
          grep -q "string/firestore_database_id" "$RES_DUMP"
          grep -q "string/project_id" "$RES_DUMP"
          CERT_OUT="$("$APKSIGNER" verify --verbose --print-certs ONE_HOME_PRO_FINAL.apk)"
          echo "$CERT_OUT"
          ACTUAL_SHA1="$(printf '%s\n' "$CERT_OUT" | sed -nE 's/.*Signer #1 certificate SHA-1 digest:\s*([0-9a-fA-F:]+).*/\1/p' | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          python3 - "$ACTUAL_SHA1" <<'PY'
          import json
          import re
          import sys

          actual_sha1 = (sys.argv[1] if len(sys.argv) > 1 else "").strip().lower()
          if not actual_sha1:
              print("::error::Could not extract Signer #1 SHA-1 from apksigner output.")
              sys.exit(1)

          with open("app/google-services.json", "r", encoding="utf-8-sig") as f:
              gs = json.load(f)
          with open("app/build.gradle.kts", "r", encoding="utf-8") as f:
              gradle_text = f.read()
          m = re.search(r'applicationId\s*=\s*"([^"]+)"', gradle_text)
          app_id = m.group(1) if m else ""

          expected_hashes = []
          for client in gs.get("client") or []:
              for oauth in client.get("oauth_client") or []:
                  android_info = oauth.get("android_info") or {}
                  if android_info.get("package_name") == app_id and android_info.get("certificate_hash"):
                      expected_hashes.append(android_info["certificate_hash"].replace(":", "").strip().lower())

          print(f"APK signing SHA-1: {actual_sha1}")
          print(f"Firebase certificate_hash entries for {app_id}: {expected_hashes}")
          if expected_hashes and actual_sha1 not in expected_hashes:
              print(f"::error::APK signing SHA-1 mismatch! Built APK SHA-1 ({actual_sha1}) does not match Firebase certificate_hash {expected_hashes}. Set the DEBUG_KEYSTORE_BASE64 GitHub Actions secret from debug.keystore.base64.")
              sys.exit(1)
          print("Verified APK signing SHA-1 matches Firebase certificate_hash.")
          PY
          VERSION_NAME="$(grep -E 'versionName\s*=' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/' | head -n 1)"
          VERSION_CODE="$(grep -E 'versionCode\s*=' app/build.gradle.kts | sed -E 's/[^0-9]//g' | head -n 1)"
          echo "version_name=${VERSION_NAME:-1.0.2}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE:-2}" >> "$GITHUB_OUTPUT"

      - name: Upload Android Debug APK Artifact
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: one-home-pro-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            ONE_HOME_PRO_FINAL.apk
          if-no-files-found: error

      - name: Check optional release signing secrets
        id: release_signing
        if: ${{ success() }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ] && [ -n "${STORE_PASSWORD:-}" ] && [ -n "${KEY_PASSWORD:-}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets configured; signed release build enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Release signing secrets not configured; skipping signed release build."
          fi

      - name: Build Signed Release APK & Play Store AAB (when upload keystore secrets configured)
        if: ${{ success() && steps.release_signing.outputs.enabled == 'true' }}
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > my-upload-key.jks
          trap 'rm -f my-upload-key.jks' EXIT
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle :app:bundleRelease :app:assembleRelease \
            --no-daemon \
            --max-workers=2 \
            -Dkotlin.compiler.execution.strategy=in-process \
            -Dorg.gradle.jvmargs="-Xmx2048m -XX:MaxMetaspaceSize=640m -Dfile.encoding=UTF-8" \
            --stacktrace \
            --console=plain
          test -s app/build/outputs/bundle/release/app-release.aab
          test -s app/build/outputs/apk/release/app-release.apk

      - name: Upload Signed Release Artifacts (when built)
        if: ${{ success() && steps.release_signing.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: one-home-pro-signed-release
          path: |
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Publish Debug APK to GitHub Release
        if: >-
          success() && (
            startsWith(github.ref, 'refs/tags/v') ||
            github.ref == 'refs/heads/main' ||
            github.ref == 'refs/heads/master' ||
            (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true')
          )
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}-build-{1}-ci-{2}', steps.apk_meta.outputs.version_name, steps.apk_meta.outputs.version_code, github.run_number) }}
          name: ONE HOME PRO v${{ steps.apk_meta.outputs.version_name }} (Build ${{ steps.apk_meta.outputs.version_code }} / CI #${{ github.run_number }})
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            ONE_HOME_PRO_FINAL.apk
            app/build/outputs/apk/debug/app-debug.apk
